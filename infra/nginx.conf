# Nginx nạp file này trong khối http. Resolver là DNS của Docker.
map $http_x_request_id $trace_id {
    default $request_id;
    "~^[0-9a-fA-F]{32}$" $http_x_request_id;
    "~^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$" $http_x_request_id;
}
log_format f168 'gateway request_id=$trace_id method=$request_method status=$status upstream=$upstream_addr';
resolver 127.0.0.11 valid=10s ipv6=off;

upstream user_api {
    zone user_api 64k;
    server user-service:8000 resolve;
}

upstream loan_api {
    zone loan_api 64k;
    server loan-service:8000 resolve;
}

upstream payment_api {
    zone payment_api 64k;
    server payment-service:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout f168;
    error_log /dev/stderr crit;
    server_tokens off;
    add_header X-Request-ID $trace_id always;
    proxy_hide_header X-Request-ID;
    proxy_set_header X-Request-ID $trace_id;
    proxy_set_header X-Internal-Token "";
    proxy_set_header Host $host;

    # Quy tắc chặn chạy ngay tại Gateway, kể cả khi caller tự gửi internal token.
    location = /api/v1/internal { return 403; }
    location ^~ /api/v1/internal/ { return 403; }
    error_page 403 = @forbidden;
    error_page 404 = @missing;
    error_page 502 504 = @unavailable;
    location @forbidden {
        default_type application/json;
        return 403 '{"error":{"code":"INTERNAL_ROUTE_FORBIDDEN","message":"Internal route.","details":{},"request_id":"$trace_id"}}';
    }
    location @missing {
        default_type application/json;
        return 404 '{"error":{"code":"ROUTE_NOT_FOUND","message":"Route not found.","details":{},"request_id":"$trace_id"}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service unavailable.","details":{},"request_id":"$trace_id"}}';
    }

    location = /health/gateway {
        default_type application/json;
        return 200 '{"service":"gateway","status":"ok"}';
    }

    location = /health/user { proxy_pass http://user_api; }
    location = /docs/user { proxy_pass http://user_api; }
    location = /openapi/user.json { proxy_pass http://user_api; }
    location ~ ^/api/v1/(auth|users)(/|$) { proxy_pass http://user_api; }

    location = /health/loan { proxy_pass http://loan_api; }
    location = /docs/loan { proxy_pass http://loan_api; }
    location = /openapi/loan.json { proxy_pass http://loan_api; }
    location ~ ^/api/v1/(loan-products|loan-applications|loans|installments)(/|$) { proxy_pass http://loan_api; }
    location ~ ^/api/v1/admin/(loan-products|loan-applications|loans)(/|$) { proxy_pass http://loan_api; }

    location = /health/payment { proxy_pass http://payment_api; }
    location = /docs/payment { proxy_pass http://payment_api; }
    location = /openapi/payment.json { proxy_pass http://payment_api; }
    location ~ ^/api/v1/(payment-otp-requests|payment-otp-verifications|payment-transactions)(/|$) { proxy_pass http://payment_api; }
    location ~ ^/api/v1/admin/(payment-transactions)(/|$) { proxy_pass http://payment_api; }

    location ~ ^/(api|health|docs|openapi|internal)(/|$) { return 404; }
    location /swagger-assets/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
